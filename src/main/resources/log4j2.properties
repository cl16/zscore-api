# properties
property.LOG_DIR = /Users/cml/dev/code/game-zscore/api_logs/
property.CUSTOM_PATTERN = [ZSCORE-API] %d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] %c{1} %M : %msg%n

# Root logger configuration
rootLogger.level = INFO
rootLogger.appenderRef.stdout.ref = STDOUT

# Custom logger for com.zscore-api package
logger.customLogger.name = com.zscore_api
logger.customLogger.level = debug
logger.customLogger.appenderRef.customFile.ref = CustomFileAppender
logger.customLogger.appenderRef.customConsole.ref = CustomConsoleAppender
logger.customLogger.additivity = false

# Console appender configuration
appender.console.name = STDOUT
appender.console.type = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [FRAMEWORK ] %d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] %c{1} %M : %msg%n

# Custom appender to file
appender.customFile.type = File
appender.customFile.name = CustomFileAppender
appender.customFile.fileName = ${LOG_DIR}/zscore-api-custom.log
appender.customFile.layout.type = PatternLayout
appender.customFile.layout.pattern = ${CUSTOM_PATTERN}

# Custom appender to console
appender.customConsole.type = Console
appender.customConsole.name = CustomConsoleAppender
appender.customConsole.filter.threshold.type = ThresholdFilter
appender.customConsole.filter.threshold.level = INFO
appender.customConsole.layout.type = PatternLayout
appender.customConsole.layout.pattern = ${CUSTOM_PATTERN}


